services:
  luau:
    image: golang:alpine
    working_dir: /app
    depends_on:
      - clients
      - users
    command: go run cmd/luau/main.go
    environment:
      - ISSUER=luau.org
      - TEMPLATES_DIR=templates
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=${AUTH_HTTP_PORT}
    ports:
      - ${AUTH_HTTP_PORT}:${AUTH_HTTP_PORT}

    env_file:
      - .env
    volumes:
      - "gohome:/go"
      - "gocache:/root/.cache/go-build"
      - .:/app
      - ./keys:/opt/luau/certs

  demo:
    image: golang:alpine
    working_dir: /app
    command: go run demo.go
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - "gohome:/go"
      - "gocache:/root/.cache/go-build"
      - ./demo:/app

  clients:
    image: golang:alpine
    working_dir: /app/clients
    command: go run cmd/server/main.go -auth_host http://${AUTH_HTTP_HOST}:${AUTH_HTTP_PORT} -http_host 0.0.0.0 -http_port ${CLIENTS_HTTP_PORT} -grpc_host 0.0.0.0 -grpc_port ${CLIENTS_GRPC_PORT} -insecure
    ports:
      - "${CLIENTS_HTTP_PORT}:${CLIENTS_HTTP_PORT}"
      - "${CLIENTS_GRPC_PORT}:${CLIENTS_GRPC_PORT}"
    env_file:
      - .env
    volumes:
      - "gohome:/go"
      - "gocache:/root/.cache/go-build"
      - .:/app
      - ./keys:/opt/luau/certs

  users:
    image: golang:alpine
    working_dir: /app/users
    command: go run cmd/server/main.go -auth_host http://${AUTH_HTTP_HOST}:${AUTH_HTTP_PORT} -http_host 0.0.0.0 -http_port ${USERS_HTTP_PORT} -grpc_host 0.0.0.0 -grpc_port ${USERS_GRPC_PORT} -insecure
    ports:
      - "${USERS_HTTP_PORT}:${USERS_HTTP_PORT}"
      - "${USERS_GRPC_PORT}:${USERS_GRPC_PORT}"
    env_file:
      - .env
    volumes:
      - "gohome:/go"
      - "gocache:/root/.cache/go-build"
      - .:/app
      - ./keys:/opt/luau/certs

volumes:
  gohome:
  gocache:
