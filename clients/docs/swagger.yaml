        "404":
          description: Not Found
      security:
      - OAuth2Application:
        - openid
      summary: update client
      tags:
      - clients
securityDefinitions:
  OAuth2Application:
    authorizationUrl: http://localhost:8080/oidc/auth
    flow: accessCode
    scopes:
      openid: '"OpenID Connect scope"'
    tokenUrl: http://localhost:8080/oidc/token
    type: oauth2
swagger: "2.0"
