paths:
  /:
    get:
      consumes:
      - application/json
      description: list clients
      parameters:
      - default: 256
        description: 'limit items (max: 1024)'
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset items
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              items:
                $ref: '#/definitions/adapters.restClient'
              type: array
            type: array
        "400":
          description: Bad Request
      security:
      - OAuth2Application:
        - openid
      summary: list clients
      tags:
      - clients
    post:
      consumes:
      - application/json
      description: create a client
      parameters:
      - description: create client
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/adapters.restCreateOrUpdateClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/adapters.restClient'
        "400":
          description: Bad Request
      security:
      - OAuth2Application:
        - openid
      summary: create a client
      tags:
      - clients
  /{id}:
    delete:
      consumes:
      - application/json
      description: delete a client by id
      parameters:
      - description: client id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
