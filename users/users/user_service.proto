syntax = "proto3";

package users;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "user.proto";

option go_package = "github.com/G5Olivieri/luau/users/users";

service UserService {
	rpc Create (CreateUserRequest) returns (User) {}
	rpc Update (User) returns (User) {}
	rpc DeleteByID (google.protobuf.StringValue) returns (google.protobuf.Empty) {}
	rpc GetByUsername (google.protobuf.StringValue) returns (User) {}
	rpc GetByUsernamePassword (UsernamePassword) returns (User) {}
	rpc GetByID (google.protobuf.StringValue) returns (User) {}
	rpc List (LimitOffset) returns (Users) {}
}

message UsernamePassword {
	string username = 1;
	string password	 = 2;
}

message LimitOffset {
	int32 limit = 1;
	int32 offset = 2;
}

message Users {
	repeated User users = 1;
}
