syntax = "proto3";

package jose;

option go_package = "github.com/G5Olivieri/luau/jose/jose";

enum JWKKeyOps {
	JWT_KEY_OPS_UNSPECIFIED = 0;
	JWT_KEY_OPS_SIGN = 1;
	JWT_KEY_OPS_VERIFY = 2;
	JWT_KEY_OPS_ENCRYPT = 3;
	JWT_KEY_OPS_DECRYPT = 4;
	JWT_KEY_OPS_WRAP_KEY = 5;
	JWT_KEY_OPS_UNWRAP_KEY = 6;
	JWT_KEY_OPS_DERIVE_KEY = 7;
	JWT_KEY_OPS_DERIVE_BITS = 8;
}

enum JWKUse {
  JWK_USE_UNSPECIFIED = 0;
  JWK_USE_SIG = 1;
  JWK_USE_ENC = 2;
}

enum JWKType {
  JWK_TYPE_UNSPECIFIED = 0;
  JWK_TYPE_RSA = 1;
  JWK_TYPE_EC = 2;
  JWK_TYPE_OCT = 3;
}

enum JWKAlg {
  JWK_ALG_UNSPECIFIED = 0;

  JWK_ALG_HS256 = 1;
  JWK_ALG_HS384 = 2;
  JWK_ALG_HS512 = 3;

  JWK_ALG_RS256 = 4;
  JWK_ALG_RS384 = 5;
  JWK_ALG_RS512 = 6;

  JWK_ALG_PS256 = 7;
  JWK_ALG_PS384 = 8;
  JWK_ALG_PS512 = 9;

  JWK_ALG_ES256 = 10;
  JWK_ALG_ES384 = 11;
  JWK_ALG_ES512 = 12;
}

enum ECCurve {
  EC_CURVE_UNSPECIFIED = 0;
  EC_CURVE_P256 = 1;
  EC_CURVE_P384 = 2;
  EC_CURVE_P521 = 3;
}

message JWK {
  JWKType kty = 1;
  JWKUse use = 2;
  JWKAlg alg = 3;
  repeated JWKKeyOps key_ops = 4;

  optional string kid = 5;  // Key ID

  // RSA-specific fields
  optional string n = 6;    // Modulus for RSA keys
  optional string e = 7;    // Exponent for RSA keys
  optional string dp = 8;
  optional string dq = 9;
  optional string qi = 10;

  // EC-specific fields
  ECCurve crv = 11;  // Curve for EC keys (e.g., "P-256")
  optional string x = 12;    // X-coordinate for EC keys
  optional string y = 13;   // Y-coordinate for EC keys

  optional string d = 14;   // EC and RSA D

  // OCT-specific fields
  optional string k = 15;

  // X.509 fields
  optional string x5u = 16;     // URI for X.509 certificate
  repeated string x5c = 17;  // Chain of X.509 certificates
  optional string x5t = 18;     // SHA-1 thumbprint of the X.509 certificate
  optional string x5t_S256 = 19;  // SHA-256 thumbprint of the X.509 certificate
}

message JWKS {
	repeated jose.JWK jwks = 1;
}
